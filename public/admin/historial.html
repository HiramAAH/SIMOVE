<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial de Rutas - Admin</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { margin: 0; padding: 0; display: flex; height: 100vh; background-color: #f4f6f9; }
    #map-container { width: 75%; height: 100vh; }
    #map { width: 100%; height: 100%; }
    #sidebar {
      width: 25%; height: 100vh; background-color: #ffffff; box-shadow: -2px 0 5px rgba(0,0,0,0.1);
      overflow-y: auto; padding: 20px; display: flex; flex-direction: column;
    }
    .route-card {
      background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px;
      padding: 15px; margin-bottom: 10px; cursor: pointer; transition: 0.2s;
    }
    .route-card:hover { background: #e9ecef; border-color: #1C6EA4; }
    .route-card.active { border: 2px solid #1C6EA4; background: #e3f2fd; }
    .badge-ventas { color: #28a745; font-weight: bold; }
    @media (max-width: 768px) {
      body { flex-direction: column; }
      #map-container, #sidebar { width: 100%; height: 50vh; }
    }
  </style>
</head>
<body>

  <div id="map-container">
    <div id="map"></div>
  </div>

  <div id="sidebar">
    <h3 class="text-primary text-center mb-3">Historial GPS</h3>
    <a href="dashboard.html" class="btn btn-secondary w-100 mb-3">Regresar al Panel</a>
    
    <div id="routes-list" class="flex-grow-1">
      <div class="text-center text-muted mt-4">Cargando viajes...</div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([22.1565, -100.9754], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    
    let routeLayerGroup = L.layerGroup().addTo(map);

    async function cargarHistorial() {
      try {
        const res = await fetch('https://simove.onrender.com/api/historial/rutas');
        const rutas = await res.json();
        const listDiv = document.getElementById('routes-list');
        listDiv.innerHTML = '';

        if(rutas.length === 0) {
            listDiv.innerHTML = '<div class="text-center text-muted mt-4">No hay rutas registradas.</div>';
            return;
        }

        rutas.forEach(r => {
          const fecha = new Date(r.fecha_inicio).toLocaleString('es-MX');
          const div = document.createElement('div');
          div.className = 'route-card';
          div.innerHTML = `
            <h6 class="mb-1">Repartidor: <strong class="text-primary">${r.nombre_usuario}</strong></h6>
            <div style="font-size: 13px; color: #666;">Inicio: ${fecha}</div>
            <div style="font-size: 14px; margin-top:5px;">Corte: <span class="badge-ventas">${r.ventas} garrafones</span></div>
          `;
          div.onclick = () => dibujarRuta(r.id_ruta, div);
          listDiv.appendChild(div);
        });
      } catch (err) {
        console.error("Error cargando rutas", err);
      }
    }

    async function dibujarRuta(id_ruta, divElement) {
      // Marcar visualmente la tarjeta activa
      document.querySelectorAll('.route-card').forEach(el => el.classList.remove('active'));
      divElement.classList.add('active');

      try {
        const res = await fetch(`https://simove.onrender.com/api/historial/coordenadas/${id_ruta}`);
        const coordenadas = await res.json();

        routeLayerGroup.clearLayers(); // Limpiar el mapa

        if(coordenadas.length === 0) {
            alert("Esta ruta no registró ninguna coordenada GPS.");
            return;
        }

        // Convertir formato para Leaflet
        const puntosLatLng = coordenadas.map(c => [c.lat, c.lng]);

        // Dibujar la línea uniendo los puntos
        const polyline = L.polyline(puntosLatLng, { color: '#1C6EA4', weight: 5 }).addTo(routeLayerGroup);

        // Marcador Inicio
        L.marker(puntosLatLng[0]).addTo(routeLayerGroup).bindPopup("<b>Inicio de Ruta</b>").openPopup();
        
        // Marcador Fin (Si hay más de 1 punto)
        if(puntosLatLng.length > 1) {
            L.circleMarker(puntosLatLng[puntosLatLng.length - 1], { color: 'red', radius: 6 }).addTo(routeLayerGroup).bindPopup("<b>Fin de Ruta</b>");
        }

        // Centrar el mapa en la ruta dibujada
        map.fitBounds(polyline.getBounds());

      } catch (err) {
        console.error("Error cargando coordenadas", err);
      }
    }

    window.onload = cargarHistorial;
  </script>
</body>
</html>
