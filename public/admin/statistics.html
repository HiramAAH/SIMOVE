<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estadísticas - Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-warning"><i class="bi bi-graph-up"></i> Estadísticas de Ventas</h2>
        <a href="dashboard.html" class="btn btn-secondary">Regresar</a>
    </div>

    <div id="mensaje-estado" class="text-center text-muted mt-5">
        <h4><i class="bi bi-hourglass-split"></i> Cargando estadísticas...</h4>
    </div>

    <div id="contenido-estadisticas" style="display: none;">
        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h5>Filtro Diario</h5>
                        <input type="date" id="filtroDia" class="form-control mb-2">
                        <button class="btn btn-primary w-100 mb-2" onclick="filtrarPorDia()">Buscar Día Específico</button>
                        <button class="btn btn-outline-secondary w-100" onclick="cargarDatos(true)">Mostrar Histórico Completo</button>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h5>Resumen Gráfico</h5>
                        <canvas id="graficaVentas"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <h5>Detalle de Cortes</h5>
                <table class="table table-striped text-center mt-3" id="tablaEstadisticas">
                    <thead class="table-dark">
                        <tr>
                            <th>Fecha</th>
                            <th>Repartidor</th>
                            <th>Garrafones Vendidos</th>
                            <th>Ingreso Total ($)</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCortes"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
const PRECIO = 15;
let cortesGlobales = [];
let chartInstance = null;

async function cargarDatos(mostrarTodos = false) {
    const mensaje = document.getElementById("mensaje-estado");
    const contenido = document.getElementById("contenido-estadisticas");
    
    try {
        // Validación estricta igual que en records.html
        const response = await fetch('https://simove.onrender.com/api/estadisticas');
        if (!response.ok) throw new Error("Las APIs no responden. Asegúrate de haber subido el nuevo server.js a GitHub.");

        cortesGlobales = await response.json();
        
        // Formateo de fechas a prueba de fallos
        cortesGlobales = cortesGlobales.map(c => {
            const f = new Date(c.fecha);
            const yyyy = f.getFullYear();
            const mm = String(f.getMonth() + 1).padStart(2, '0');
            const dd = String(f.getDate()).padStart(2, '0');
            
            return {
                ...c,
                fechaFiltro: `${yyyy}-${mm}-${dd}`, // Para el input HTML
                fechaVista: f.toLocaleDateString('es-MX', { year: 'numeric', month: '2-digit', day: '2-digit' }) // Para la tabla
            };
        });

        // Mostramos la interfaz
        mensaje.style.display = "none";
        contenido.style.display = "block";

        if (mostrarTodos) {
            document.getElementById('filtroDia').value = '';
            renderTabla(cortesGlobales);
            generarGrafica(cortesGlobales);
        } else {
            const hoy = new Date();
            const fechaHoy = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}-${String(hoy.getDate()).padStart(2, '0')}`;
            document.getElementById('filtroDia').value = fechaHoy;
            filtrarPorDia();
        }
    } catch (error) {
        console.error("Error:", error);
        mensaje.innerHTML = `<h4 style="color: red;"><i class="bi bi-exclamation-triangle"></i> Error: ${error.message}</h4>`;
    }
}

function filtrarPorDia() {
    const fecha = document.getElementById("filtroDia").value;
    if(!fecha) return;

    const filtrados = cortesGlobales.filter(c => c.fechaFiltro === fecha);
    renderTabla(filtrados);
    generarGrafica(filtrados);
}

function renderTabla(data) {
    const tbody = document.getElementById("tablaCortes");
    tbody.innerHTML = "";
    
    if(data.length === 0) {
        tbody.innerHTML = "<tr><td colspan='4'>No hay ventas registradas en esta selección.</td></tr>";
        return;
    }

    let totalDinero = 0;
    data.forEach(corte => {
        const total = corte.vendidos * PRECIO;
        totalDinero += total;
        tbody.innerHTML += `
            <tr>
                <td>${corte.fechaVista}</td>
                <td><strong>${corte.repartidor}</strong></td>
                <td>${corte.vendidos}</td>
                <td class="text-success fw-bold">$${total}.00</td>
            </tr>
        `;
    });
    
    tbody.innerHTML += `
        <tr class="table-warning fw-bold">
            <td colspan="3" class="text-end">TOTAL RECAUDADO:</td>
            <td class="text-success">$${totalDinero}.00</td>
        </tr>
    `;
}

function generarGrafica(data) {
    const ventasPorRepartidor = {};
    data.forEach(c => {
        ventasPorRepartidor[c.repartidor] = (ventasPorRepartidor[c.repartidor] || 0) + c.vendidos;
    });

    const etiquetas = Object.keys(ventasPorRepartidor);
    const valores = Object.values(ventasPorRepartidor);

    if (chartInstance) chartInstance.destroy();

    const ctx = document.getElementById("graficaVentas").getContext("2d");
    chartInstance = new Chart(ctx, {
        type: "bar",
        data: {
            labels: etiquetas,
            datasets: [{ label: "Garrafones Vendidos", data: valores, backgroundColor: "#1C6EA4" }]
        },
        options: { responsive: true }
    });
}

window.onload = () => cargarDatos(false);
</script>
</body>
</html>
