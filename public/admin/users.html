<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuarios - Admin</title>

<script>
  const userAuth = JSON.parse(localStorage.getItem('usuario'));
  if (!userAuth || userAuth.rol !== 'admin') window.location.replace('index.html');
</script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<style>
  body { background-color: #f4f8fb; font-family: system-ui, -apple-system, sans-serif; padding-bottom: 20px;}
  .navbar-custom { background: linear-gradient(90deg, #0277bd 0%, #00acc1 100%); color: white; padding: 15px; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 30px;}
  
  .card-custom { border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
  .table-custom th { background-color: #f8f9fa; color: #0288d1; font-weight: 700; border-bottom: 2px solid #e0e0e0; }
  .table-custom td { vertical-align: middle; }
  
  .modal-content { border-radius: 20px; border: none; }
  .modal-header { border-top-left-radius: 20px; border-top-right-radius: 20px; background: linear-gradient(90deg, #0277bd, #00acc1); }
</style>
</head>
<body>

<div class="navbar-custom d-flex justify-content-between align-items-center">
  <h5 class="m-0 fw-bold"><i class="bi bi-people"></i> Gestión de Usuarios</h5>
  <button class="btn btn-sm btn-light rounded-pill fw-bold text-primary shadow-sm" onclick="window.location.href='dashboard.html'">
    <i class="bi bi-arrow-left"></i> Panel
  </button>
</div>

<div class="container">
    <div class="d-flex justify-content-end mb-3">
        <button class="btn btn-info text-white fw-bold rounded-pill shadow-sm" onclick="abrirModalNuevo()">
            <i class="bi bi-person-plus-fill"></i> Agregar Usuario
        </button>
    </div>

    <div class="card card-custom overflow-hidden">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover table-custom text-center mb-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Rol</th>
                        <th>Contraseña</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="userTable">
                    <tr><td colspan="5" class="text-muted py-4"><div class="spinner-border text-info mb-2" role="status"></div><br>Cargando usuarios...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="userModal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow">
      <div class="modal-header text-white">
        <h5 class="modal-title fw-bold" id="modalTitle">Nuevo Usuario</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <input type="hidden" id="userId">
        <div class="mb-3">
            <label class="form-label text-muted fw-bold small">Nombre de Usuario</label>
            <input type="text" id="nombre" class="form-control" placeholder="Ej: Juan Perez">
        </div>
        <div class="mb-3">
            <label class="form-label text-muted fw-bold small">Rol del Sistema</label>
            <select id="rol" class="form-select">
                <option value="repartidor">Repartidor</option>
                <option value="admin">Administrador</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label text-muted fw-bold small">Contraseña</label>
            <input type="text" id="password" class="form-control" placeholder="Contraseña segura">
        </div>
      </div>
      <div class="modal-footer border-0 pb-4 pe-4">
        <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-info text-white fw-bold rounded-pill px-4" onclick="guardarUsuario()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// AQUÍ VA TU LÓGICA DE JAVASCRIPT INTACTA
const myModal = new bootstrap.Modal(document.getElementById('userModal'));
const urlBase = 'https://simove.onrender.com/api/usuarios';

async function cargarUsuarios() {
    try {
        const response = await fetch(urlBase);
        const usuarios = await response.json();
        const tbody = document.getElementById("userTable");
        tbody.innerHTML = "";
        
        usuarios.forEach(user => {
            tbody.innerHTML += `
                <tr>
                    <td class="text-muted fw-semibold">#${user.id_usuario}</td>
                    <td><strong class="text-dark">${user.nombre_usuario}</strong></td>
                    <td><span class="badge ${user.rol === 'admin' ? 'bg-danger' : 'bg-info'} rounded-pill">${user.rol.toUpperCase()}</span></td>
                    <td class="text-muted">${user.password}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary rounded-circle" onclick="abrirModalEditar(${user.id_usuario}, '${user.nombre_usuario}', '${user.rol}', '${user.password}')"><i class="bi bi-pencil-fill"></i></button>
                        <button class="btn btn-sm btn-outline-danger rounded-circle ms-1" onclick="eliminarUsuario(${user.id_usuario})"><i class="bi bi-trash-fill"></i></button>
                    </td>
                </tr>
            `;
        });
    } catch (error) {
        console.error("Error cargando usuarios", error);
    }
}

function abrirModalNuevo() {
    document.getElementById("modalTitle").textContent = "Nuevo Usuario";
    document.getElementById("userId").value = "";
    document.getElementById("nombre").value = "";
    document.getElementById("rol").value = "repartidor";
    document.getElementById("password").value = "";
    myModal.show();
}

function abrirModalEditar(id, nombre, rol, password) {
    document.getElementById("modalTitle").textContent = "Editar Usuario";
    document.getElementById("userId").value = id;
    document.getElementById("nombre").value = nombre;
    document.getElementById("rol").value = rol;
    document.getElementById("password").value = password;
    myModal.show();
}

async function guardarUsuario() {
    const id = document.getElementById("userId").value;
    const data = {
        nombre_usuario: document.getElementById("nombre").value,
        rol: document.getElementById("rol").value,
        password: document.getElementById("password").value
    };

    const method = id ? 'PUT' : 'POST';
    const url = id ? `${urlBase}/${id}` : urlBase;

    await fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    
    myModal.hide();
    cargarUsuarios();
}

async function eliminarUsuario(id) {
    if(confirm("¿Seguro que deseas eliminar a este usuario permanentemente?")) {
        await fetch(`${urlBase}/${id}`, { method: 'DELETE' });
        cargarUsuarios();
    }
}

window.onload = cargarUsuarios;
</script>
</body>
</html>
