<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuarios - Admin</title>

<script>
  const userAuth = JSON.parse(localStorage.getItem('usuario'));
  if (!userAuth || userAuth.rol !== 'admin') window.location.replace('index.html');
</script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<style>
  body { background-color: #f4f8fb; font-family: system-ui, -apple-system, sans-serif; padding-bottom: 20px;}
  .navbar-custom { background: linear-gradient(90deg, #0277bd 0%, #00acc1 100%); color: white; padding: 15px; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 30px;}
  .card-custom { border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
</style>
</head>
<body>

<nav class="navbar navbar-custom">
  <div class="container">
    <a class="navbar-brand text-white fw-bold" href="#"><i class="bi bi-people-fill"></i> Gestión de Usuarios</a>
    <button class="btn btn-outline-light btn-sm" onclick="window.location.href='dashboard.html'">Volver</button>
  </div>
</nav>

<div class="container">
  <div class="card card-custom p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="m-0">Lista de Usuarios</h4>
      <button class="btn btn-primary" onclick="abrirModal()"><i class="bi bi-plus-lg"></i> Nuevo</button>
    </div>
    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Rol</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaUsuarios"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="userModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Nuevo Usuario</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="userId">
        <div class="mb-3">
          <label>Nombre de usuario</label>
          <input type="text" id="nombre" class="form-control">
        </div>
        <div class="mb-3">
          <label>Rol</label>
          <select id="rol" class="form-select">
            <option value="admin">Administrador</option>
            <option value="repartidor">Repartidor</option>
            <option value="ventanilla">Ventanilla</option>
          </select>
        </div>
        <div class="mb-3">
          <label>Contraseña</label>
          <input type="password" id="password" class="form-control">
          <small class="text-muted" id="passwordHelp" style="display:none;">Déjalo en blanco para mantener la actual.</small>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarUsuario()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const urlBase = '/api/usuarios';
  const myModal = new bootstrap.Modal(document.getElementById('userModal'));

  async function cargarUsuarios() {
    const res = await fetch(urlBase, {
      headers: { 
        'x-user-rol': userAuth.rol 
      }
    });
    const usuarios = await res.json();
    const tbody = document.getElementById("tablaUsuarios");
    tbody.innerHTML = "";
    usuarios.forEach(u => {
      tbody.innerHTML += `
        <tr>
          <td>${u.nombre_usuario}</td>
          <td><span class="badge bg-secondary">${u.rol}</span></td>
          <td>
            <button class="btn btn-sm btn-warning" onclick="editarUsuario(${u.id_usuario}, '${u.nombre_usuario}', '${u.rol}')"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-sm btn-danger" onclick="eliminarUsuario(${u.id_usuario})"><i class="bi bi-trash"></i></button>
          </td>
        </tr>
      `;
    });
  }

  function abrirModal() {
    document.getElementById("modalTitle").innerText = "Nuevo Usuario";
    document.getElementById("userId").value = "";
    document.getElementById("nombre").value = "";
    document.getElementById("rol").value = "repartidor";
    document.getElementById("password").value = "";
    document.getElementById("passwordHelp").style.display = "none";
    myModal.show();
  }

  function editarUsuario(id, nombre, rol) {
    document.getElementById("modalTitle").innerText = "Editar Usuario";
    document.getElementById("userId").value = id;
    document.getElementById("nombre").value = nombre;
    document.getElementById("rol").value = rol;
    document.getElementById("password").value = "";
    document.getElementById("passwordHelp").style.display = "block";
    myModal.show();
  }

  async function guardarUsuario() {
    const id = document.getElementById("userId").value;
    const password = document.getElementById("password").value;
    const data = {
        nombre_usuario: document.getElementById("nombre").value,
        rol: document.getElementById("rol").value,
        password: password
    };
    if(!id && password.trim() === '') {
        alert("Un usuario nuevo necesita una contraseña.");
        return;
    }
    const method = id ? 'PUT' : 'POST';
    const url = id ? `${urlBase}/${id}` : urlBase;
    await fetch(url, {
        method: method,
        headers: { 
            'Content-Type': 'application/json',
            'x-user-rol': userAuth.rol 
        },
        body: JSON.stringify(data)
    });
    myModal.hide();
    cargarUsuarios();
  }

  async function eliminarUsuario(id) {
    if(confirm("¿Seguro que deseas eliminar a este usuario permanentemente?")) {
        await fetch(`${urlBase}/${id}`, {
            method: 'DELETE',
            headers: { 
                'x-user-rol': userAuth.rol 
            }
        });
        cargarUsuarios();
    }
  }

  cargarUsuarios();
</script>
</body>
</html>
