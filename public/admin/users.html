<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuarios - Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary"><i class="bi bi-people"></i> Gestión de Usuarios</h2>
        <div>
            <button class="btn btn-success" onclick="abrirModalNuevo()"><i class="bi bi-person-plus"></i> Agregar Usuario</button>
            <a href="dashboard.html" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Regresar</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover text-center">
                <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Rol</th>
                        <th>Contraseña</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="userTable">
                    <tr><td colspan="5">Cargando usuarios desde la base de datos...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="userModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="modalTitle">Nuevo Usuario</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="userId">
        <div class="mb-3">
            <label>Nombre de Usuario</label>
            <input type="text" id="nombre" class="form-control" placeholder="Ej: Juan Perez">
        </div>
        <div class="mb-3">
            <label>Rol</label>
            <select id="rol" class="form-select">
                <option value="repartidor">Repartidor</option>
                <option value="admin">Administrador</option>
            </select>
        </div>
        <div class="mb-3">
            <label>Contraseña</label>
            <input type="text" id="password" class="form-control" placeholder="Contraseña">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="guardarUsuario()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const myModal = new bootstrap.Modal(document.getElementById('userModal'));
const urlBase = 'https://simove.onrender.com/api/usuarios';

async function cargarUsuarios() {
    try {
        const response = await fetch(urlBase);
        const usuarios = await response.json();
        const tbody = document.getElementById("userTable");
        tbody.innerHTML = "";
        
        usuarios.forEach(user => {
            tbody.innerHTML += `
                <tr>
                    <td>${user.id_usuario}</td>
                    <td><strong>${user.nombre_usuario}</strong></td>
                    <td><span class="badge ${user.rol === 'admin' ? 'bg-danger' : 'bg-success'}">${user.rol.toUpperCase()}</span></td>
                    <td>${user.password}</td>
                    <td>
                        <button class="btn btn-sm btn-warning" onclick="abrirModalEditar(${user.id_usuario}, '${user.nombre_usuario}', '${user.rol}', '${user.password}')"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-danger" onclick="eliminarUsuario(${user.id_usuario})"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>
            `;
        });
    } catch (error) {
        console.error("Error cargando usuarios", error);
    }
}

function abrirModalNuevo() {
    document.getElementById("modalTitle").textContent = "Nuevo Usuario";
    document.getElementById("userId").value = "";
    document.getElementById("nombre").value = "";
    document.getElementById("rol").value = "repartidor";
    document.getElementById("password").value = "";
    myModal.show();
}

function abrirModalEditar(id, nombre, rol, password) {
    document.getElementById("modalTitle").textContent = "Editar Usuario";
    document.getElementById("userId").value = id;
    document.getElementById("nombre").value = nombre;
    document.getElementById("rol").value = rol;
    document.getElementById("password").value = password;
    myModal.show();
}

async function guardarUsuario() {
    const id = document.getElementById("userId").value;
    const data = {
        nombre_usuario: document.getElementById("nombre").value,
        rol: document.getElementById("rol").value,
        password: document.getElementById("password").value
    };

    const method = id ? 'PUT' : 'POST';
    const url = id ? `${urlBase}/${id}` : urlBase;

    await fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    
    myModal.hide();
    cargarUsuarios();
}

async function eliminarUsuario(id) {
    if(confirm("¿Seguro que deseas eliminar a este usuario permanentemente?")) {
        await fetch(`${urlBase}/${id}`, { method: 'DELETE' });
        cargarUsuarios();
    }
}

window.onload = cargarUsuarios;
</script>
</body>
</html>
