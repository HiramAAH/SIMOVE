<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Admin</title>
  
  <script>
    const userAuth = JSON.parse(localStorage.getItem('usuario'));
    if (!userAuth || userAuth.rol !== 'admin') {
      window.location.replace('index.html'); // Expulsar
    }
  </script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  
  <style>
    body { background-color: #f4f8fb; font-family: system-ui, -apple-system, sans-serif; }
    .navbar-custom { background: linear-gradient(90deg, #0277bd 0%, #00acc1 100%); padding: 15px; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 30px;}
    .welcome-header { color: #0288d1; font-weight: 800; }
    
    a { text-decoration: none; }
    .dashboard-card {
      border: none;
      border-radius: 20px;
      transition: all 0.3s ease;
      color: white;
      overflow: hidden;
    }
    .dashboard-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 25px rgba(0,0,0,0.15);
    }
    .card-icon { font-size: 3.5rem; margin-bottom: 10px; opacity: 0.9; }
    
    /* Paleta Agua para el Admin */
    .bg-users { background: linear-gradient(135deg, #4fc3f7, #0288d1); }
    .bg-routes { background: linear-gradient(135deg, #4db6ac, #00897b); }
    .bg-stats { background: linear-gradient(135deg, #64b5f6, #1e88e5); }
    .bg-history { background: linear-gradient(135deg, #81d4fa, #1976d2); }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark navbar-custom shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#"><i class="bi bi-droplet-fill"></i> SIMOVE Admin</a>
      <button class="btn btn-outline-light btn-sm fw-bold rounded-pill" onclick="cerrarSesion()">
        <i class="bi bi-box-arrow-right"></i> Salir
      </button>
    </div>
  </nav>

  <div class="container">
    <div class="row mb-4">
      <div class="col-12 text-center text-md-start">
        <h2 class="welcome-header">Panel de Control</h2>
        <p class="text-muted">Selecciona un módulo para gestionar la operación.</p>
      </div>
    </div>

    <div class="row g-4 justify-content-center justify-content-md-start">
        <div class="col-6 col-md-3">
            <a href="users.html">
                <div class="card dashboard-card bg-users h-100 p-4 text-center">
                    <i class="bi bi-people-fill card-icon"></i>
                    <h5 class="fw-bold m-0">Usuarios</h5>
                </div>
            </a>
        </div>
        <div class="col-6 col-md-3">
            <a href="monitoring.html">
                <div class="card dashboard-card bg-routes h-100 p-4 text-center">
                    <i class="bi bi-geo-alt-fill card-icon"></i>
                    <h5 class="fw-bold m-0">Mapa GPS</h5>
                </div>
            </a>
        </div>
        <div class="col-6 col-md-3">
            <a href="statistics.html">
                <div class="card dashboard-card bg-stats h-100 p-4 text-center">
                    <i class="bi bi-bar-chart-fill card-icon"></i>
                    <h5 class="fw-bold m-0">Estadísticas</h5>
                </div>
            </a>
        </div>
        <div class="col-6 col-md-3">
            <a href="historial.html">
                <div class="card dashboard-card bg-history h-100 p-4 text-center">
                    <i class="bi bi-clock-history card-icon"></i>
                    <h5 class="fw-bold m-0">Historial</h5>
                </div>
            </a>
        </div>
    </div>
  </div>

  <script>
    function cerrarSesion() {
      localStorage.removeItem('usuario');
      window.location.replace('../index.html');
    }
  </script>
</body>
</html>
