<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  
  <style>
    /* Quita el subrayado de los enlaces que envuelven las tarjetas */
    a {
      text-decoration: none;
    }

    /* Animación para las tarjetas al pasar el mouse */
    .card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-10px); /* Mueve la tarjeta hacia arriba */
      box-shadow: 0 10px 20px rgba(0,0,0,0.2); /* Añade una sombra para dar profundidad */
    }
  </style>

  <script>
    
    const usuario = JSON.parse(localStorage.getItem('usuario'));

    if (!usuario) {
      alert('Acceso no autorizado. Inicia sesión.');
      window.location.href = '/';
    } else if (usuario.rol !== 'admin') {
      alert('No tienes permisos para acceder a esta página.');
      window.location.href = '/';
    }

    function cerrarSesion() {
      localStorage.removeItem('usuario');
      window.location.href = '/';
    }
    
  </script>
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#"><i class="bi bi-droplet-half"></i> Purificadora - Admin</a>
      <button class="btn btn-outline-light" onclick="cerrarSesion()"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</button>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="row">
      <div class="col">
        <h2>Bienvenido, <strong>ADMINISTRADOR</strong></h2>
        <p>Dashboard principal del sistema de la purificadora.</p>
      </div>
    </div>

    <div class="row mt-4">
        <a href="users.html">
            <div class="col-md-4">
                <div class="card text-white bg-primary mb-3">
                    <div class="card-body">
                        <h5 class="card-title"><i class="bi bi-people"></i> Usuarios</h5>
                        <p class="card-text">Gestión de usuarios y permisos.</p>
                    </div>
                </div>
            </div>
        </a>
        <a href="monitoring.html">
            <div class="col-md-4">
                <div class="card text-white bg-success mb-3">
                    <div class="card-body">
                        <h5 class="card-title"><i class="bi bi-truck"></i> Rutas</h5>
                        <p class="card-text">Monitoreo y gestión de rutas de reparto.</p>
                    </div>
                </div>
            </div>
        </a>
        <a href="statistics.html">
            <div class="col-md-4">
                <div class="card text-white bg-warning mb-3">
                    <div class="card-body">
                        <h5 class="card-title"><i class="bi bi-graph-up"></i> Estadísticas</h5>
                        <p class="card-text">Visualización de métricas y reportes.</p>
                    </div>
                </div>
            </div>
        </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
