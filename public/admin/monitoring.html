<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monitoreo GPS - Admin</title>
  
  <script>
    const userAuth = JSON.parse(localStorage.getItem('usuario'));
    if (!userAuth || userAuth.rol !== 'admin') window.location.replace('index.html');
  </script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; background-color: #f4f8fb; }
    
    /* Navbar Fija Superior */
    .navbar-custom { background: linear-gradient(90deg, #0277bd 0%, #00acc1 100%); color: white; padding: 10px 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 1050; position: relative;}
    
    /* Estructura Principal */
    .main-wrapper { display: flex; height: calc(100vh - 56px); flex-direction: row; }
    
    #map-container { width: 75%; height: 100%; }
    #map { width: 100%; height: 100%; z-index: 1; }
    
    #sidebar { width: 25%; height: 100%; background-color: #ffffff; box-shadow: -4px 0 15px rgba(0,0,0,0.05); overflow-y: auto; padding: 20px; z-index: 10; display: flex; flex-direction: column; }

    /* Tarjetas de Repartidores */
    .driver-card { border: none; border-radius: 15px; background: #f8f9fa; border-left: 5px solid #00acc1; transition: all 0.3s; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
    .driver-card:hover { transform: translateX(-5px); box-shadow: 0 6px 12px rgba(0,0,0,0.08); background: #ffffff; }
    .status-dot { display: inline-block; width: 10px; height: 10px; background-color: #28a745; border-radius: 50%; box-shadow: 0 0 5px #28a745; }
    .status-dot.waiting { background-color: #ffc107; box-shadow: 0 0 5px #ffc107; }

    .empty-state { text-align: center; color: #888; font-style: italic; margin-top: 40px; }

    /* Responsivo para Celulares */
    @media (max-width: 768px) {
      .main-wrapper { flex-direction: column; }
      #map-container { width: 100%; height: 50%; }
      #sidebar { width: 100%; height: 50%; border-top-left-radius: 20px; border-top-right-radius: 20px; margin-top: -15px; box-shadow: 0 -5px 20px rgba(0,0,0,0.15); padding: 15px; }
    }
  </style>
</head>
<body>

  <nav class="navbar-custom d-flex justify-content-between align-items-center">
    <h5 class="m-0 fw-bold"><i class="bi bi-geo-alt-fill text-warning"></i> Radar SIMOVE</h5>
    <button class="btn btn-sm btn-light rounded-pill fw-bold text-primary shadow-sm" onclick="window.location.href='dashboard.html'">
      <i class="bi bi-arrow-left"></i> Panel
    </button>
  </nav>

  <div class="main-wrapper">
    <div id="map-container">
      <div id="map"></div>
    </div>

    <div id="sidebar">
      <h6 class="text-primary fw-bold mb-3 border-bottom pb-2"><i class="bi bi-broadcast"></i> Unidades en Ruta</h6>
      <div id="drivers-list" class="flex-grow-1">
        <div class="empty-state">
            <div class="spinner-grow text-info spinner-grow-sm mb-2" role="status"></div><br>
            Esperando conexión...
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://simove.onrender.com/socket.io/socket.io.js"></script>

  <script>
    const socket = io('https://simove.onrender.com', {
      query: { id_usuario: userAuth.id_usuario, nombre_usuario: userAuth.nombre_usuario, rol: userAuth.rol }
    });
    const driversListDiv = document.getElementById('drivers-list');

    const map = L.map('map').setView([22.1565, -100.9754], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap SIMOVE' }).addTo(map);

    let markers = {}; 
    let estadoActualRutas = {};
    let primerCentrado = false; // Variable nueva para evitar saltos en el mapa

    socket.on('estado_rutas', (rutasActivas) => {
      estadoActualRutas = rutasActivas;
      actualizarInterfaz();
    });

    function actualizarInterfaz() {
      const repartidores = Object.values(estadoActualRutas);

      if (repartidores.length === 0) {
        driversListDiv.innerHTML = '<div class="empty-state"><i class="bi bi-truck text-muted fs-1"></i><br>No hay repartidores activos.</div>';
        for (let nombre in markers) map.removeLayer(markers[nombre]);
        markers = {};
        primerCentrado = false; // Se resetea si todos terminan su turno
        return;
      }

      // Quitamos el mensaje de "No hay repartidores" sin destruir lo demás
      const emptyState = driversListDiv.querySelector('.empty-state');
      if (emptyState) emptyState.remove();

      const coordenadasActivas = []; 

      repartidores.forEach(rep => {
        const isGPSActive = rep.lat ? true : false;
        
        // 1. DOM DIFFING: si la tarjeta ya existe usando un ID único
        let card = document.getElementById(`card-${rep.usuario}`);

        if (!card) {
          // Si NO existe, creamos la estructura HTML por primera vez
          card = document.createElement('div');
          card.id = `card-${rep.usuario}`;
          card.className = 'card driver-card card-body p-3';
          card.innerHTML = `
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h6 class="fw-bold m-0 text-dark">
                <span id="dot-${rep.usuario}" class="status-dot ${!isGPSActive ? 'waiting' : ''} me-2"></span>${rep.usuario}
              </h6>
              <span id="ventas-${rep.usuario}" class="badge bg-success rounded-pill fs-6">${rep.ventas} Garrafones</span>
            </div>
            <div class="d-flex justify-content-between align-items-end mt-2">
              <div class="text-muted small">
                <i class="bi bi-stopwatch"></i> <strong id="time-${rep.usuario}">00m 00s</strong>
              </div>
              <div id="gps-container-${rep.usuario}" class="small fw-bold ${isGPSActive ? 'text-info' : 'text-warning'}">
                <i id="gps-icon-${rep.usuario}" class="bi ${isGPSActive ? 'bi-geo-fill' : 'bi-hourglass-split'}"></i> 
                <span id="gps-text-${rep.usuario}">${isGPSActive ? 'GPS Activo' : 'Buscando...'}</span>
              </div>
            </div>
          `;
          driversListDiv.appendChild(card);
        } else {
          // Si YA existe, solo actualizamos los valores de texto para anular el parpadeo
          document.getElementById(`ventas-${rep.usuario}`).innerText = `${rep.ventas} Garrafones`;
          
          const dot = document.getElementById(`dot-${rep.usuario}`);
          const gpsContainer = document.getElementById(`gps-container-${rep.usuario}`);
          const gpsIcon = document.getElementById(`gps-icon-${rep.usuario}`);
          const gpsText = document.getElementById(`gps-text-${rep.usuario}`);

          if (isGPSActive) {
            dot.classList.remove('waiting');
            gpsContainer.className = 'small fw-bold text-info';
            gpsIcon.className = 'bi bi-geo-fill';
            gpsText.innerText = 'GPS Activo';
          } else {
            dot.classList.add('waiting');
            gpsContainer.className = 'small fw-bold text-warning';
            gpsIcon.className = 'bi bi-hourglass-split';
            gpsText.innerText = 'Buscando...';
          }
        }

        // 2. ACTUALIZACIÓN DE PINES DEL MAPA
        if (isGPSActive) {
          coordenadasActivas.push([rep.lat, rep.lng]); 
          if (markers[rep.usuario]) {
            markers[rep.usuario].setLatLng([rep.lat, rep.lng]);
            const nuevoContenido = `<div class='text-center'><b class='text-primary fs-6'>${rep.usuario}</b><br><span class='badge bg-success mt-1'>${rep.ventas} Ventas</span></div>`;
            
            // Solo recarga el texto del globito si hubo una venta nueva
            if (markers[rep.usuario].getPopup().getContent() !== nuevoContenido) {
              markers[rep.usuario].getPopup().setContent(nuevoContenido);
            }
          } else {
            const nuevoPin = L.marker([rep.lat, rep.lng]).addTo(map);
            nuevoPin.bindPopup(`<div class='text-center'><b class='text-primary fs-6'>${rep.usuario}</b><br><span class='badge bg-success mt-1'>${rep.ventas} Ventas</span></div>`);
            markers[rep.usuario] = nuevoPin;
          }
        }
      });

      // 3. LIMPIEZA DE DESCONECTADOS
      const tarjetasExistentes = driversListDiv.querySelectorAll('.driver-card');
      tarjetasExistentes.forEach(tarjeta => {
         const idUsuario = tarjeta.id.replace('card-', '');
         if (!estadoActualRutas[idUsuario]) tarjeta.remove();
      });

      for (let nombreEnMapa in markers) {
        if (!estadoActualRutas[nombreEnMapa]) {
          map.removeLayer(markers[nombreEnMapa]);
          delete markers[nombreEnMapa];
        }
      }
      
      // 4. EVITAR QUE EL MAPA SALTE
      if (!primerCentrado && coordenadasActivas.length > 0) {
        if (coordenadasActivas.length === 1) {
          map.setView(coordenadasActivas[0], 15);
        } else {
          const limites = L.latLngBounds(coordenadasActivas);
          map.fitBounds(limites, { padding: [50, 50] });
        }
        primerCentrado = true; 
      }
    }
    

    setInterval(() => {
      const ahora = Date.now();
      Object.values(estadoActualRutas).forEach(rep => {
        const timeElement = document.getElementById(`time-${rep.usuario}`);
        if (timeElement && rep.horaInicio) {
          const diferencia = ahora - rep.horaInicio;
          const horas = Math.floor((diferencia / (1000 * 60 * 60)) % 24);
          const minutos = Math.floor((diferencia / 1000 / 60) % 60);
          const segundos = Math.floor((diferencia / 1000) % 60);
          timeElement.innerText = (horas > 0 ? horas + "h " : "") + (minutos < 10 ? "0" : "") + minutos + "m " + (segundos < 10 ? "0" : "") + segundos + "s";
        }
      });
    }, 1000);
  </script>
</body>
</html>
