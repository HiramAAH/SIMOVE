<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Monitoreo - Admin</title>
<script src="/socket.io/socket.io.js"></script>
</head>
<body>

<h2>Monitoreo en tiempo real</h2>
<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

socket.on('connect', () => {
  console.log('Admin conectado al monitoreo');
});

socket.on('usuarios_activos', (lista) => {
  console.log('Usuarios activos actualmente:');
  lista.forEach(u => {
    console.log(`${u.nombre_usuario} (${u.rol})`);
  });
});

socket.on('usuario_ingreso', (user) => {
  console.log(`${user.nombre_usuario} ingresó (${user.rol})`);
});

socket.on('usuario_salida', (user) => {
  console.log(`${user.nombre_usuario} cerró sesión o perdió conexión`);
});
</script>

</body>
</html>
