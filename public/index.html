<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Purificadora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #6CC0E5, #1C6EA4);
    }
    .login-card {
      background-color: #fff;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .login-card h1 {
      color: #1C6EA4;
      margin-bottom: 1.5rem;
    }
    .error {
      color: red;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h1><i class="bi bi-droplet-half"></i> Purificadora El Manantial</h1>
    <div class="mb-3">
      <input type="text" id="nombre_usuario" class="form-control" placeholder="Usuario">
    </div>
    <div class="mb-3">
      <input type="password" id="password" class="form-control" placeholder="Contraseña">
    </div>
    <button onclick="login()" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión</button>
    <div class="error" id="error"></div>
  </div>

  <script>
    async function login() {
      const nombre_usuario = document.getElementById('nombre_usuario').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error');
      errorDiv.textContent = '';

      try {
        const respuesta = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre_usuario, password })
        });
        const data = await respuesta.json();

        if (data.success) {
          localStorage.setItem('usuario', JSON.stringify(data.user));
          if (data.user.rol === 'admin') window.location.href = 'admin/dashboard.html';
          else window.location.href = 'repartidor/dashboard.html';
        } else {
          errorDiv.textContent = data.message || 'Usuario o contraseña incorrecta';
        }
      } catch (err) {
        errorDiv.textContent = 'Error de conexión con el servidor';
        console.error(err);
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
