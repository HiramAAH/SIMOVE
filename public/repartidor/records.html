<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Cortes - Repartidor</title>

  <script>
    const userAuth = JSON.parse(localStorage.getItem('usuario'));
    if (!userAuth || userAuth.rol !== 'repartidor') {
      window.location.replace('index.html'); // Expulsar
    }
  </script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body { background-color: #f4f8fb; font-family: system-ui, -apple-system, sans-serif; padding-bottom: 20px;}
    .navbar-custom { background: linear-gradient(90deg, #0288d1 0%, #29b6f6 100%); color: white; padding: 15px; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 30px;}
    
    .card-custom { border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .table-custom th { background-color: #f8f9fa; color: #0288d1; font-weight: 700; border-bottom: 2px solid #e0e0e0; }
    .table-custom td { vertical-align: middle; }
    
    .loading-container { min-height: 50vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  </style>
</head>
<body>

  <div class="navbar-custom d-flex justify-content-between align-items-center">
    <h5 class="m-0 fw-bold"><i class="bi bi-receipt"></i> Mis Cortes</h5>
    <button class="btn btn-sm btn-light rounded-pill fw-bold text-primary shadow-sm" onclick="window.location.href='dashboard.html'">
      <i class="bi bi-arrow-left"></i> Volver
    </button>
  </div>

  <div class="container">
    
    <div id="mensaje-estado" class="text-center text-muted loading-container">
      <div class="spinner-border text-info mb-3" role="status"></div>
      <h5>Buscando tus cortes...</h5>
    </div>

    <div class="card card-custom overflow-hidden" id="contenedor-tabla" style="display: none;">
      <div class="card-body p-0 table-responsive">
        <table class="table table-hover table-custom text-center mb-0" id="tablaCortes">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Vendidos</th>
              <th>Total (MXN)</th>
            </tr>
          </thead>
          <tbody>
            </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const precioGarrafon = 15;
    const tbody = document.getElementById('tablaCortes').querySelector('tbody');
    const contenedorTabla = document.getElementById('contenedor-tabla');
    const mensajeEstado = document.getElementById('mensaje-estado');

    function formatearFecha(fechaString) {
      const opciones = { year: 'numeric', month: '2-digit', day: '2-digit' };
      // Ajuste automático de UTC para evitar el desfase de 6 horas
      const fechaServidor = new Date(fechaString);
      const fechaAjustada = new Date(fechaServidor.getTime() + (6 * 60 * 60 * 1000));
      return fechaAjustada.toLocaleDateString('es-MX', opciones);
    }

    async function cargarCortes() {
      try {
        const respuesta = await fetch(`https://simove.onrender.com/api/mis-cortes?id_usuario=${userAuth.id_usuario}`);
        
        if (!respuesta.ok) throw new Error("Error de conexión con el servidor.");

        const cortesDB = await respuesta.json();

        if (cortesDB.length === 0) {
          mensajeEstado.innerHTML = '<i class="bi bi-folder-x fs-1 text-muted mb-3"></i><h5>Aún no tienes cortes registrados.</h5><p class="text-muted small">Tus ventas aparecerán aquí al finalizar tu ruta.</p>';
          return;
        }

        tbody.innerHTML = '';
        cortesDB.forEach(corte => {
          const tr = document.createElement('tr');
          const fechaLimpia = formatearFecha(corte.fecha);
          const totalMXN = corte.garrafones_vendidos * precioGarrafon;

          tr.innerHTML = `
            <td class="text-muted fw-semibold">${fechaLimpia}</td>
            <td><span class="badge bg-info rounded-pill fs-6">${corte.garrafones_vendidos}</span></td>
            <td class="text-success fw-bold fs-5">$${totalMXN}.00</td>
          `;
          tbody.appendChild(tr);
        });

        mensajeEstado.style.display = 'none';
        contenedorTabla.style.display = 'block';

      } catch (error) {
        console.error("Error:", error);
        mensajeEstado.innerHTML = `<i class="bi bi-exclamation-triangle-fill text-danger fs-1 mb-3"></i><h5 class="text-danger">${error.message}</h5>`;
      }
    }

    window.onload = cargarCortes;
  </script>
</body>
</html>
