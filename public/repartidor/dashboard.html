<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Repartidor</title>

  <script>
    const userAuth = JSON.parse(localStorage.getItem('usuario'));
    if (!userAuth || userAuth.rol !== 'repartidor') {
      window.location.replace('index.html'); // Expulsar
    }
  </script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  
  <style>
    body { background-color: #f4f8fb; font-family: system-ui, -apple-system, sans-serif; }
    .navbar-custom { background: linear-gradient(90deg, #0288d1 0%, #29b6f6 100%); padding: 15px; }
    .welcome-header { color: #0288d1; font-weight: 800; margin-top: 2rem; }
    
    a { text-decoration: none; }
    .dashboard-card {
      border: none;
      border-radius: 20px;
      transition: all 0.3s ease;
      color: white;
      overflow: hidden;
    }
    .dashboard-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 25px rgba(0,0,0,0.15);
    }
    .card-icon { font-size: 3.5rem; margin-bottom: 10px; opacity: 0.9; }
    
    /* Paleta Agua/Verde Limpio */
    .bg-route { background: linear-gradient(135deg, #4fc3f7, #0288d1); }
    .bg-records { background: linear-gradient(135deg, #4db6ac, #00897b); }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark navbar-custom shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#"><i class="bi bi-droplet-fill"></i> SIMOVE</a>
      <button class="btn btn-outline-light btn-sm fw-bold rounded-pill" onclick="cerrarSesion()">
        <i class="bi bi-box-arrow-right"></i> Salir
      </button>
    </div>
  </nav>

  <div class="container">
    <div class="row">
      <div class="col-12 text-center text-md-start">
        <h2 class="welcome-header">Hola, <span id="nombreUser"></span> <i class="bi bi-hand-wave text-warning"></i></h2>
        <p class="text-muted">¿Qué deseas hacer en tu turno de hoy?</p>
      </div>
    </div>

    <div class="row mt-4 g-4 justify-content-center justify-content-md-start">
      <div class="col-6 col-md-4">
        <a href="routes.html">
          <div class="card dashboard-card bg-route h-100 p-4 text-center">
            <i class="bi bi-geo-alt-fill card-icon"></i>
            <h5 class="fw-bold m-0">Mi Ruta</h5>
          </div>
        </a>
      </div>
      
      <div class="col-6 col-md-4">
        <a href="records.html">
          <div class="card dashboard-card bg-records h-100 p-4 text-center">
            <i class="bi bi-receipt card-icon"></i>
            <h5 class="fw-bold m-0">Mis Cortes</h5>
          </div>
        </a>
      </div>
    </div>
  </div>

  <script>
    // Mostrar nombre del usuario
    document.getElementById('nombreUser').innerText = userAuth.nombre_usuario;

    function cerrarSesion() {
      localStorage.removeItem('usuario');
      window.location.replace('../index.html');
    }
  </script>
</body>
</html>
